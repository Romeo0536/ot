# ตั้งค่าระบบ AI Agent นักบัญชี
# ปรับหมวดหมู่และโฟลเดอร์ได้ตามธุรกิจของคุณ

model: claude-opus-4-8

paths:
  inbox: inbox          # โฟลเดอร์ที่ทิ้งใบเสร็จเข้ามา (PDF/รูป)
  organized: organized  # โฟลเดอร์ปลายทางที่จัดเรียงแล้ว
  ledger: data/ledger.csv   # สมุดบัญชีรวม (ทุกใบเสร็จ)

# หมวดรายจ่าย ให้ AI เลือกจัดประเภทใบเสร็จลงหมวดเหล่านี้
categories:
  - ค่าเดินทาง
  - ค่าอาหาร/รับรอง
  - ค่าวัสดุสำนักงาน
  - ค่าสาธารณูปโภค
  - ค่าซอฟต์แวร์/บริการออนไลน์
  - ค่าการตลาด/โฆษณา
  - ค่าจ้าง/บริการ
  - ค่าเช่า
  - อื่นๆ

# สกุลเงินเริ่มต้น (ใช้เมื่อใบเสร็จไม่ระบุ)
default_currency: THB
