# ตั้งค่าระบบ AI Agent นักบัญชี
# ปรับหมวดหมู่และโฟลเดอร์ได้ตามธุรกิจของคุณ

# เลือก AI provider: gemini (free tier), groq (free แต่รองรับไฟล์เล็ก), หรือ claude
provider: gemini

# โมเดล — ให้ตรงกับ provider ที่เลือก
#   gemini: gemini-2.5-flash (เร็ว/ถูก), gemini-2.5-pro (แม่นกว่า)
#   groq: mixtral-8x7b-32768 (ฟรี ไม่มี rate limit)
#   claude: claude-opus-4-8, claude-haiku-4-5
model: gemini-2.5-flash

paths:
  inbox: inbox          # โฟลเดอร์ที่ทิ้งใบเสร็จเข้ามา (PDF/รูป)
  organized: organized  # โฟลเดอร์ปลายทางที่จัดเรียงแล้ว
  ledger: data/ledger.csv   # สมุดบัญชีรวม (ทุกใบเสร็จ)

# หมวดรายจ่าย ให้ AI เลือกจัดประเภทใบเสร็จลงหมวดเหล่านี้
categories:
  - ค่าเดินทาง
  - ค่าอาหาร/รับรอง
  - ค่าวัสดุสำนักงาน
  - ค่าสาธารณูปโภค
  - ค่าซอฟต์แวร์/บริการออนไลน์
  - ค่าการตลาด/โฆษณา
  - ค่าจ้าง/บริการ
  - ค่าเช่า
  - อื่นๆ

# สกุลเงินเริ่มต้น (ใช้เมื่อใบเสร็จไม่ระบุ)
default_currency: THB
