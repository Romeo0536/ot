version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-accounting
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    command: serve
    # ตั้ง GPU (ถ้ามี NVIDIA GPU)
